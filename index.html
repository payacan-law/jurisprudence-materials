<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0D1B2A">
<link rel="icon" href="logo.png">
<title>Jurisprudence | Юриспруденция</title>
<style>
  :root {
    --navy: #0D1B2A;
    --navy-dark: #08121d;
    --blue: #1B4D8C;
    --blue-bright: #3B82F6;
    --pale: #E6EAF0;
    --bg: #F6F8FA;
    --card: #ffffff;
    --text: #101418;
    --text-muted: #6b7280;
    --border: #e6e9ee;
    --danger-bg: #fdeeee;
    --danger-text: #b3261e;
    --danger: #d3453c;
    --success-bg: #eaf6ec;
    --success-text: #1e7a33;
    --warning-bg: #fff6e0;
    --warning-text: #8a6100;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font-family: inherit; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); padding-bottom: 90px; position: relative; }

  svg.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; display: block; }

  /* ---------- topbar ---------- */
  header.topbar {
    background: var(--navy);
    color: #fff;
    padding: 14px 16px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header.topbar .brand-row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  header.topbar .brand-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  header.topbar .brand-row img.logo { width: 28px; height: 28px; flex-shrink: 0; }
  header.topbar .title { font-size: 15.5px; font-weight: 700; margin: 0; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.topbar .title .divider { color: #5b6b80; font-weight: 400; margin: 0 5px; }
  header.topbar .subtitle { font-size: 12.5px; color: #8a97ab; margin: 2px 0 0; }
  header.topbar .icon-btn { background: rgba(255,255,255,0.08); border: none; color: #fff; width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  header.topbar .back {
    background: none; border: none; color: #fff; font-size: 14.5px;
    display: flex; align-items: center; gap: 4px; margin-bottom: 8px; cursor: pointer; padding: 0;
  }
  header.topbar .back svg { width: 17px; height: 17px; }

  .search-box { margin: 12px 16px 4px; }
  .search-box input {
    width: 100%; padding: 11px 14px 11px 38px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); font-size: 15px;
    background-repeat: no-repeat; background-position: 12px center;
  }
  .search-box { position: relative; }
  .search-box svg { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--text-muted); pointer-events: none; }
  .search-box input:focus { outline: 2px solid var(--navy); outline-offset: -1px; }

  .section-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin: 20px 16px 8px; }

  .list { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer;
  }
  .card:active { background: #eef1f5; }
  .card .card-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .card .icon-badge { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .card .card-title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .card .card-sub { font-size: 12.5px; color: var(--text-muted); margin: 0; }
  .card .chev { color: #b7bfc9; flex-shrink: 0; }
  .card .chev svg { width: 18px; height: 18px; }

  /* ---------- home ---------- */
  .hero-progress {
    margin: 14px 16px 6px; background: var(--navy); border-radius: 16px; padding: 18px;
    display: flex; align-items: center; justify-content: space-between; color: #fff;
  }
  .hero-progress .hp-text p.hp-title { font-size: 14.5px; font-weight: 700; margin: 0 0 4px; }
  .hero-progress .hp-text p.hp-sub { font-size: 12px; color: #a9b4c4; margin: 0 0 10px; }
  .hero-progress .hp-bar { width: 150px; height: 5px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; }
  .hero-progress .hp-bar-fill { height: 100%; background: var(--blue-bright); border-radius: 4px; }
  .ring-wrap { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
  .ring-wrap svg { width: 64px; height: 64px; transform: rotate(-90deg); }
  .ring-wrap circle { fill: none; stroke-width: 8; }
  .ring-wrap .ring-bg { stroke: rgba(255,255,255,0.15); }
  .ring-wrap .ring-fg { stroke: var(--blue-bright); stroke-linecap: round; transition: stroke-dashoffset .4s; }
  .ring-wrap .ring-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }

  .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 14px 16px 4px; }
  .home-tile { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 14px; text-align: left; cursor: pointer; }
  .home-tile:active { background: #eef1f5; }
  .home-tile .icon-badge { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
  .home-tile .tname { font-weight: 700; font-size: 14.5px; margin: 0 0 2px; }
  .home-tile .tdesc { font-size: 11.5px; color: var(--text-muted); margin: 0; line-height: 1.4; }

  .quote-band { margin: 6px 16px 4px; background: var(--blue); border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 12px; color: #fff; }
  .quote-band svg { width: 22px; height: 22px; flex-shrink: 0; }
  .quote-band .qb-title { font-size: 13.5px; font-weight: 700; margin: 0 0 2px; }
  .quote-band .qb-sub { font-size: 12px; color: #cbdaf3; margin: 0; }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 6px; padding: 12px 16px 4px; overflow-x: auto; }
  .tab-btn { flex: 1; padding: 9px 6px; font-size: 13px; text-align: center; border-radius: 9px; border: 1px solid var(--border); background: var(--card); color: var(--text-muted); cursor: pointer; white-space: nowrap; }
  .tab-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); font-weight: 600; }

  .term-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .term-card .term { font-weight: 600; font-size: 14.5px; margin: 0 0 4px; }
  .term-card .def { font-size: 13.5px; color: var(--text-muted); margin: 0; line-height: 1.5; }
  .term-card .group-tag { display: inline-block; font-size: 11px; background: var(--warning-bg); color: var(--warning-text); padding: 2px 8px; border-radius: 999px; margin-bottom: 6px; }

  .date-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .date-card .date { font-weight: 600; font-size: 13px; color: var(--blue-bright); margin: 0 0 3px; }
  .date-card .info { font-size: 14px; margin: 0; line-height: 1.5; }

  .quote-card { background: var(--navy); color: #fff; border-radius: 12px; padding: 16px; margin-bottom: 10px; }
  .quote-card .q { font-style: italic; font-size: 14.5px; line-height: 1.6; margin: 0 0 10px; }
  .quote-card .author-btn { background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 12.5px; padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  .quote-card .author-shown { font-size: 13px; color: var(--blue-bright); font-weight: 600; }

  .empty { padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 14px; }
  .empty svg { width: 32px; height: 32px; margin-bottom: 10px; color: #c7ccd4; }

  .npa-reader { padding: 12px 16px 40px; font-size: 14.5px; line-height: 1.65; }
  .npa-reader h1 { font-size: 18px; margin: 0 0 12px; }
  .npa-reader h2 { font-size: 16px; margin: 22px 0 8px; padding-top: 10px; border-top: 1px solid var(--border); }
  .npa-reader h3 { font-size: 14.5px; margin: 16px 0 6px; color: var(--navy); }
  .npa-reader h4 { font-size: 13.5px; margin: 12px 0 4px; color: var(--text-muted); }
  .npa-reader p { margin: 6px 0; }
  .npa-reader ul, .npa-reader ol { padding-left: 20px; margin: 6px 0; }
  .npa-reader li { margin: 4px 0; }
  .npa-reader table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 10px 0 16px; background: var(--card); border-radius: 8px; overflow: hidden; }
  .npa-reader th, .npa-reader td { border: 1px solid var(--border); padding: 7px 9px; text-align: left; vertical-align: top; }
  .npa-reader th { background: var(--navy); color: #fff; font-weight: 600; font-size: 12.5px; }
  .npa-reader strong { color: var(--navy-dark); }

  .callout { background: var(--warning-bg); border-left: 3px solid var(--blue-bright); border-radius: 0 8px 8px 0; padding: 10px 12px; margin: 10px 0; }
  .callout-title { color: var(--warning-text); font-weight: 600; font-size: 13px; margin: 0 0 4px; }

  /* ---------- bottom nav ---------- */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; background: var(--card); border-top: 1px solid var(--border);
    display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index: 20;
  }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 4px 2px; color: var(--text-muted); position: relative; }
  .nav-item svg { width: 21px; height: 21px; }
  .nav-item .nlabel { font-size: 10.5px; font-weight: 500; }
  .nav-item.active { color: var(--blue-bright); }

  /* ---------- auth ---------- */
  .auth-screen { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; padding: 32px 24px; background: var(--navy); }
  .auth-logo { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 28px; }
  .auth-logo img { width: 56px; height: 56px; }
  .auth-logo .an { color: #fff; font-size: 20px; font-weight: 800; text-align: center; letter-spacing: -0.01em; }
  .auth-logo .ar { color: #8a97ab; font-size: 13px; text-align: center; }
  .auth-card { background: #fff; border-radius: 18px; padding: 24px 20px; }
  .auth-card h2 { font-size: 18px; margin: 0 0 4px; }
  .auth-card .auth-sub { font-size: 13px; color: var(--text-muted); margin: 0 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
  .field input, .field select { width: 100%; padding: 12px 13px; border-radius: 10px; border: 1px solid var(--border); font-size: 15px; background: #fafbfc; }
  .field input:focus, .field select:focus { outline: 2px solid var(--navy); outline-offset: -1px; background: #fff; }
  .btn-primary { width: 100%; padding: 13px; border-radius: 11px; border: none; background: var(--navy); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .btn-primary:active { background: var(--navy-dark); }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-secondary { width: 100%; padding: 12px; border-radius: 11px; border: 1px solid var(--border); background: #fff; color: var(--text); font-size: 14.5px; font-weight: 600; cursor: pointer; }
  .btn-danger { padding: 8px 12px; border-radius: 9px; border: 1px solid #f3c9c6; background: var(--danger-bg); color: var(--danger-text); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn-ghost { background: none; border: none; color: var(--blue-bright); font-size: 13.5px; font-weight: 600; cursor: pointer; padding: 6px 0; }
  .auth-error { background: var(--danger-bg); color: var(--danger-text); font-size: 13px; padding: 10px 12px; border-radius: 9px; margin-bottom: 14px; }
  .auth-note { background: var(--warning-bg); color: var(--warning-text); font-size: 12.5px; padding: 10px 12px; border-radius: 9px; margin-bottom: 14px; line-height: 1.5; }
  .loading-screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--navy); color: #8a97ab; font-size: 13px; }
  .spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.15); border-top-color: var(--blue-bright); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- profile ---------- */
  .profile-head { display: flex; align-items: center; gap: 14px; padding: 20px 16px 10px; }
  .avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--blue); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; flex-shrink: 0; }
  .profile-head .pname { font-size: 17px; font-weight: 700; margin: 0 0 2px; }
  .profile-head .prole { font-size: 12.5px; color: var(--text-muted); margin: 0; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 6px 16px 4px; }
  .stat-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .stat-box .sval { font-size: 20px; font-weight: 800; color: var(--navy); margin: 0; }
  .stat-box .slabel { font-size: 11.5px; color: var(--text-muted); margin: 4px 0 0; }
  .prog-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .prog-row .pr-name { font-size: 13.5px; font-weight: 600; }
  .prog-row .pr-pct { font-size: 12.5px; color: var(--text-muted); }
  .prog-track { height: 7px; background: var(--pale); border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
  .prog-fill { height: 100%; background: var(--blue-bright); border-radius: 4px; }
  .result-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .result-row:last-child { border-bottom: none; }
  .result-row .rname { font-size: 13.5px; font-weight: 600; margin: 0 0 2px; }
  .result-row .rdate { font-size: 11.5px; color: var(--text-muted); margin: 0; }
  .result-badge { font-size: 12.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
  .result-badge.good { background: var(--success-bg); color: var(--success-text); }
  .result-badge.mid { background: var(--warning-bg); color: var(--warning-text); }
  .result-badge.bad { background: var(--danger-bg); color: var(--danger-text); }

  /* ---------- tests ---------- */
  .test-cat-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; }
  .test-cat-card .tc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .test-cat-card .tc-title { font-size: 15px; font-weight: 700; margin: 0; }
  .test-cat-card .tc-count { font-size: 12px; color: var(--text-muted); margin: 0; }
  .test-cat-card .tc-best { font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--pale); color: var(--blue); }

  .quiz-progress-bar { height: 5px; background: var(--pale); margin: 0 16px 6px; border-radius: 4px; overflow: hidden; }
  .quiz-progress-fill { height: 100%; background: var(--blue-bright); border-radius: 4px; transition: width .3s; }
  .quiz-qnum { font-size: 12px; color: var(--text-muted); padding: 8px 16px 0; margin: 0; }
  .quiz-question { font-size: 17px; font-weight: 700; padding: 8px 16px 16px; margin: 0; line-height: 1.4; }
  .quiz-options { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }
  .quiz-opt { background: var(--card); border: 1.5px solid var(--border); border-radius: 12px; padding: 13px 14px; font-size: 14.5px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; }
  .quiz-opt .opt-letter { width: 24px; height: 24px; border-radius: 7px; background: var(--pale); color: var(--blue); font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .quiz-opt.selected { border-color: var(--blue-bright); background: #eef4ff; }
  .quiz-opt.correct { border-color: var(--success-text); background: var(--success-bg); }
  .quiz-opt.incorrect { border-color: var(--danger-text); background: var(--danger-bg); }
  .quiz-opt.disabled { pointer-events: none; }
  .quiz-footer { padding: 16px; }

  .result-hero { text-align: center; padding: 36px 24px 20px; }
  .result-ring-wrap { width: 128px; height: 128px; margin: 0 auto 18px; position: relative; }
  .result-ring-wrap svg { width: 128px; height: 128px; transform: rotate(-90deg); }
  .result-ring-wrap circle { fill: none; stroke-width: 10; }
  .result-ring-wrap .ring-bg { stroke: var(--pale); }
  .result-ring-wrap .ring-fg { stroke: var(--blue-bright); stroke-linecap: round; }
  .result-ring-wrap .ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .result-ring-wrap .ring-label .rpct { font-size: 26px; font-weight: 800; color: var(--navy); }
  .result-ring-wrap .ring-label .rfrac { font-size: 12px; color: var(--text-muted); }
  .result-hero .rtitle { font-size: 17px; font-weight: 700; margin: 0 0 4px; }
  .result-hero .rsub { font-size: 13.5px; color: var(--text-muted); margin: 0; }
  .result-actions { padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px; }

  /* ---------- admin ---------- */
  .admin-tile { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; cursor: pointer; }
  .admin-tile .icon-badge { width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .admin-tile .at-title { font-size: 14.5px; font-weight: 700; margin: 0 0 2px; }
  .admin-tile .at-sub { font-size: 12px; color: var(--text-muted); margin: 0; }
  .user-row { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .user-row .ur-name { font-size: 14px; font-weight: 700; margin: 0 0 2px; }
  .user-row .ur-meta { font-size: 12px; color: var(--text-muted); margin: 0; }
  .role-badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 6px; text-transform: uppercase; letter-spacing: .02em; }
  .role-badge.admin { background: var(--warning-bg); color: var(--warning-text); }
  .role-badge.user { background: var(--pale); color: var(--blue); }
  .fab {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(calc(-50% + 190px));
    width: 52px; height: 52px; border-radius: 50%; background: var(--navy); color: #fff; border: none;
    box-shadow: 0 6px 16px rgba(13,27,42,0.35); cursor: pointer; z-index: 25; display: flex; align-items: center; justify-content: center;
  }
  .fab svg { width: 24px; height: 24px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(8,18,29,0.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .modal-sheet { background: #fff; width: 100%; max-width: 480px; border-radius: 18px 18px 0 0; padding: 20px; max-height: 88vh; overflow-y: auto; }
  .modal-sheet h3 { font-size: 16.5px; margin: 0 0 16px; }
  .modal-close-row { display: flex; justify-content: flex-end; margin-bottom: -6px; }
  .modal-close-row button { background: var(--pale); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; }
  .q-editor-row { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .q-editor-row .qer-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .q-editor-row .qer-q { font-size: 13.5px; font-weight: 600; margin: 0; flex: 1; }
  .q-editor-row .qer-opts { font-size: 12.5px; color: var(--text-muted); margin: 4px 0 0; line-height: 1.6; }
  .q-editor-row .qer-opts .correct-opt { color: var(--success-text); font-weight: 600; }
  .icon-btn-sm { background: var(--pale); border: none; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-muted); flex-shrink: 0; }
  .icon-btn-sm.danger { background: var(--danger-bg); color: var(--danger-text); }
  .radio-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .radio-row input[type=radio] { width: 17px; height: 17px; accent-color: var(--blue-bright); flex-shrink: 0; }
  .radio-row input[type=text] { flex: 1; }
  .toast { position: fixed; left: 50%; bottom: 108px; transform: translateX(-50%); background: var(--navy); color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 999px; z-index: 60; box-shadow: 0 6px 16px rgba(0,0,0,0.25); }

  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
